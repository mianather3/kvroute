[workspace]
resolver = "2"
members = [
    "crates/kvroute-core",
    "crates/kvroute-sim",
    "crates/kvroute-proxy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mianather3/kvroute"

[workspace.dependencies]
kvroute-core = { path = "crates/kvroute-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
rand_chacha = "0.3"
proptest = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
arc-swap = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"
